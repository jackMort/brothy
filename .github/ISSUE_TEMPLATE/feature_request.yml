name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations: { required: true }
  - type: textarea
    id: idea
    attributes:
      label: What would you like brothy to do?
      description: Keys, behavior, mockups welcome. brothy is a reader, so editing features are out of scope.
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
