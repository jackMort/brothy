name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bunx biome ci .
      # knip also checks site/: it needs the site's packages installed to see the astro binary
      - run: cd site && bun install --frozen-lockfile
      - run: bunx knip
      - run: bun test
      - run: bun run build
      - run: ./brothy --version

  # the whole tree against the committed health baseline (the accepted complexity findings, one entry per function): any new
  # finding fails, and so does an entry nothing matches any more (prune it); git history and the clock never change the verdict.
  # On a pull request, fallow audit also fails when an accepted function grows (--worsened error); it needs the base branch's
  # history, hence the full checkout. The baseline is passed here, not set as audit.healthBaseline in .fallowrc.jsonc: the audit
  # would then hide the accepted functions, growth included. The version is pinned so a new release cannot turn a run red.
  fallow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx fallow@3.37.0 --health-baseline .github/fallow-health-baseline.json --baseline-mode identity --fail-on-stale-baseline
      - if: github.event_name == 'pull_request'
        run: bunx fallow@3.37.0 audit --base origin/${{ github.base_ref }} --worsened error
